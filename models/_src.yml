sources:
  - name: jaffale_shop
    database: raw
    schema: jaffle_shop

    #Source jaffale_shop level freshness
    config:
      freshness:
        warn_after:
          count: 12
          period: hour
        error_after:
          count: 24
          period: hour
      loaded_at_field: _loaded_at

    tables:
      - name: orders
        
      - name: customers
      - name: order_status_history

  - name: stripe
    database: raw
    schema: stripe
    tables: 
      - name: payments
        